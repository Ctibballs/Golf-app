name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golfkit-linux:
    name: GolfKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v5
      - name: Run tests
        run: swift test --package-path Packages/GolfKit

  ios:
    name: iOS app build + GolfKit tests (macOS)
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - name: Xcode version
        run: xcodebuild -version
      - name: GolfKit tests
        run: swift test --package-path Packages/GolfKit
      - name: Build app for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Fairway.xcodeproj \
            -scheme Fairway \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log | grep -E '(error|warning):|BUILD (SUCCEEDED|FAILED)' || true
          grep -q 'BUILD SUCCEEDED' xcodebuild.log
      - name: Show compiler errors
        if: failure()
        run: grep -E 'error:' xcodebuild.log | sort -u | head -150
      - name: Capture screenshots in the simulator
        id: screenshots
        continue-on-error: true
        timeout-minutes: 20
        run: .github/scripts/screenshots.sh DerivedData/Build/Products/Debug-iphonesimulator/Fairway.app screenshots
      - name: Upload screenshots
        if: always() && steps.screenshots.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
